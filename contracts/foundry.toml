[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# Parity fixture is generated by ../model/risk_curve.py and read by RiskParamsParity.t.sol
fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    # Deploy.s.sol writes the address book the frontend and signer service read.
    { access = "read-write", path = "./deployments" },
]
gas_reports = ["ScoreOracle", "LendingPool", "RiskParams"]

[fuzz]
runs = 512
max_test_rejects = 100000

[profile.ci]
verbosity = 2

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
